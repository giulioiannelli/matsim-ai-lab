# Model profiles — per-model overrides applied on top of LLMConfigGroup defaults.
#
# Keyed by model name (the value of -Dexec.args=... second arg / --model-name).
# A profile is looked up by the modelName configured in the runner; if none
# matches, LLMConfigGroup defaults win.
#
# Fields:
#   maxTokens        : cap on total completion tokens (reasoning + output combined
#                      for backends that don't split them, e.g. Ollama).
#   contextWindow    : total context window (prompt + completion) in tokens. Mapped
#                      to Ollama's options.num_ctx. Set high enough to hold system
#                      prompt + plan JSON + tool definitions + multi-turn history.
#                      Ignored by OpenAI-compat backends.
#   temperature      : sampling temperature.
#   enableThinking   : whether to send think=true / enable_thinking=true to the
#                      backend. Reasoning models should have this on.
#   isReasoning      : model emits a separate reasoning stream. When true, the
#                      runner disables grammar-constrained decoding (which would
#                      otherwise exhaust the token budget inside the think trace
#                      before the tool-call JSON can emit).
#   thinkingTokenCap : soft cap on reasoning-token count per round. 0 means unlimited
#                      (bounded only by maxTokens). When > 0 and reasoning exceeds
#                      this value, thinkingTokenCapHit is incremented for that round.
#                      Advisory only — no truncation enforced at the request level.
#   endpointStyle    : openai_compat | ollama_native. Use ollama_native for local
#                      Ollama models so tool calls land in the structured field
#                      instead of leaking into content.

profiles:

  # Non-thinking baseline — regression reference, compatible with grammar mode.
  "qwen2.5:7b":
    maxTokens: 4096
    contextWindow: 8192
    temperature: 0.3
    enableThinking: false
    isReasoning: false
    thinkingTokenCap: 0

  "llama3.1:8b":
    maxTokens: 4096
    contextWindow: 8192
    temperature: 0.3
    enableThinking: false
    isReasoning: false
    thinkingTokenCap: 0

  # Reasoning models — grammar OFF, think ON, native endpoint preferred so tool
  # calls land in the structured field.
  "qwen3.5":
    maxTokens: 4096
    contextWindow: 8192
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 2048
    endpointStyle: ollama_native

  # Tiny variant — used for remote-endpoint plumbing tests; same family
  # behaviour (thinking + native endpoint), not expected to plan well.
  "qwen3.5:0.8b":
    maxTokens: 4096
    contextWindow: 8192
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 2048
    endpointStyle: ollama_native

  "qwen3.5:latest":
    maxTokens: 4096
    contextWindow: 8192
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 2048
    endpointStyle: ollama_native

  # Remote (mari) large model. Combined VRAM there is ~18-19 GB and the Q4
  # weights alone are 16.5 GB, so large contexts spill KV cache to CPU.
  # Probe-validated on mari 2026-07-23: ctx 12288 → 1.0 GB spill (same as
  # ctx 4096), 21.6 tok/s generation. Larger contexts unmeasured.
  # 9B right-sizing candidate for the remote 2x11GB server: fits fully at
  # ctx 12288 (the 27B spills and reloads every call above ctx 4096).
  "qwen3.5:9b":
    maxTokens: 6144
    contextWindow: 12288
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 3072
    endpointStyle: ollama_native
  # gpuLayers: 999 forces full GPU residency (Ollama num_gpu). The 27B Q4 fits
  # the remote 2x11GB server at ctx 12288 (17.4 GB), but the server's estimator
  # otherwise spills ~1.8 GB to CPU, halving speed and reloading every call.
  "qwen3.6:27b":
    maxTokens: 6144
    contextWindow: 12288
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 3072
    endpointStyle: ollama_native
    gpuLayers: 999

  "qwen3:14b":
    maxTokens: 6144
    contextWindow: 12288
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 3072
    endpointStyle: ollama_native

  "deepseek-r1-distill-qwen:7b":
    maxTokens: 6144
    contextWindow: 12288
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 2048
    endpointStyle: ollama_native

  "deepseek-r1-distill-qwen:14b":
    maxTokens: 8192
    contextWindow: 16384
    temperature: 0.3
    enableThinking: true
    isReasoning: true
    thinkingTokenCap: 3072
    endpointStyle: ollama_native

  # Small edge model — grammar-compatible.
  "gemma4:e4b":
    maxTokens: 4096
    contextWindow: 8192
    temperature: 0.3
    enableThinking: false
    isReasoning: false
    thinkingTokenCap: 0
